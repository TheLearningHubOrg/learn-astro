# Serves the output of `astro build` (output: 'static', build.format: 'directory').
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Astro puts hashed bundles in /_astro/. Their names change when content changes.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # A multi-page site, not an SPA: unknown paths get Astro's 404 page, not index.html.
    error_page 404 /404.html;
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }
}
